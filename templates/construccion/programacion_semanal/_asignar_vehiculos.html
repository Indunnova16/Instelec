<form class="mt-5 border-t pt-4" method="post" action="{% url 'construccion:psc_vehiculo_agregar' pk=programacion.pk %}">
    {% csrf_token %}
    <fieldset>
        <legend class="font-medium">Agregar vehículo</legend>
        <label class="mt-3 block text-sm font-medium" for="vehiculo-id">Vehículo activo</label>
        <select id="vehiculo-id" name="vehiculo_id" required class="mt-1 w-full rounded border p-2">
            <option value="">Seleccione un vehículo</option>
            {% for vehiculo in vehiculos_disponibles %}<option value="{{ vehiculo.pk }}">{{ vehiculo.placa }} — {{ vehiculo.get_tipo_display }}</option>{% empty %}<option value="" disabled>No hay vehículos activos sin asignar</option>{% endfor %}
        </select>
        <label class="mt-3 block text-sm font-medium" for="conductor-id">Conductor (opcional)</label>
        <select id="conductor-id" name="conductor_id" class="mt-1 w-full rounded border p-2">
            <option value="">Sin conductor asignado</option>
            {% for asignacion in personal_asignado %}<option value="{{ asignacion.personal.pk }}">{{ asignacion.personal.nombre }} — {{ asignacion.personal.documento }}</option>{% endfor %}
        </select>
        {% if vehiculos_disponibles %}<button class="mt-3 rounded bg-blue-600 px-4 py-2 text-white" type="submit">Agregar vehículo</button>{% else %}<p class="mt-3 text-sm text-slate-600" role="status">No hay vehículos activos disponibles.</p>{% endif %}
    </fieldset>
</form>
