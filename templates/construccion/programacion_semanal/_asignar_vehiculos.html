<form class="mt-5 border-t pt-4" method="post" action="{% url 'construccion:psc_vehiculo_agregar' pk=programacion.pk %}">
    {% csrf_token %}
    <fieldset>
        <legend class="font-medium">Agregar vehículo</legend>
        <label class="mt-3 block text-sm font-medium" for="conductor-id">Conductor activo de Construcción</label>
        <select id="conductor-id" name="conductor_id" required class="js-tomselect mt-1 w-full rounded border p-2" data-testid="psc-conductor-select">
            <option value="">Seleccione un colaborador</option>
            {% for asignacion in conductores_disponibles %}<option value="{{ asignacion.personal.pk }}" data-es-conductor="{% if asignacion.personal.rol_cuadrilla_id|slice:':9' == 'CONDUCTOR' %}true{% else %}false{% endif %}">{{ asignacion.personal.nombre }} — {{ asignacion.personal.documento }} — {{ asignacion.personal.rol_cuadrilla.nombre }}</option>{% endfor %}
        </select>
        <p id="conductor-help" class="mt-1 text-sm text-slate-600">Puede buscar por nombre, cédula o cargo. La placa se habilita solo para cargos de conductor.</p>
        <div id="placa-vehiculo-wrapper" class="hidden">
            <label class="mt-3 block text-sm font-medium" for="vehiculo-id">Placa del vehículo activo</label>
            <select id="vehiculo-id" name="vehiculo_id" disabled class="js-tomselect mt-1 w-full rounded border p-2" aria-describedby="conductor-help" data-testid="psc-placa-select">
                <option value="">Seleccione una placa</option>
                {% for vehiculo in vehiculos_disponibles %}<option value="{{ vehiculo.pk }}">{{ vehiculo.placa }} — {{ vehiculo.get_tipo_display }}</option>{% empty %}<option value="" disabled>No hay vehículos activos sin asignar</option>{% endfor %}
            </select>
        </div>
        {% if vehiculos_disponibles %}<button class="mt-3 rounded bg-blue-600 px-4 py-2 text-white" type="submit">Agregar vehículo</button>{% else %}<p class="mt-3 text-sm text-slate-600" role="status">No hay vehículos activos disponibles.</p>{% endif %}
    </fieldset>
</form>
<script>
(function () {
    var conductor = document.getElementById('conductor-id');
    var placa = document.getElementById('vehiculo-id');
    var wrapper = document.getElementById('placa-vehiculo-wrapper');
    if (!conductor || !placa || !wrapper) { return; }
    function actualizarPlaca() {
        var option = conductor.options[conductor.selectedIndex];
        var esConductor = option && option.dataset.esConductor === 'true';
        wrapper.classList.toggle('hidden', !esConductor);
        placa.disabled = !esConductor;
        placa.required = esConductor;
        if (!esConductor && placa.tomselect) {
            placa.tomselect.clear(true);
        }
    }
    conductor.addEventListener('change', actualizarPlaca);
    actualizarPlaca();
})();
</script>
