{% extends "base.html" %}

{% block title %}Editar Usuario - TransMaint{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Editar Usuario</h1>
        <p class="text-gray-600 dark:text-gray-400 mt-1">{{ usuario.get_full_name }}</p>
    </div>

    {% if messages %}
    <div class="space-y-2">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-lg text-sm
            {% if message.tags == 'success' %}bg-green-50 border border-green-200 text-green-800
            {% else %}bg-red-50 border border-red-200 text-red-800{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6 space-y-4">
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nombre</label>
                <input type="text" name="first_name" value="{{ usuario.first_name }}" required
                       class="w-full px-3 py-2 border rounded-lg text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Apellido</label>
                <input type="text" name="last_name" value="{{ usuario.last_name }}"
                       class="w-full px-3 py-2 border rounded-lg text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Correo electronico</label>
            <input type="email" name="email" value="{{ usuario.email }}" required
                   class="w-full px-3 py-2 border rounded-lg text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Documento</label>
                <input type="text" name="documento" value="{{ usuario.documento }}"
                       class="w-full px-3 py-2 border rounded-lg text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Telefono</label>
                <input type="text" name="telefono" value="{{ usuario.telefono }}"
                       class="w-full px-3 py-2 border rounded-lg text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Cargo</label>
            <input type="text" name="cargo" value="{{ usuario.cargo }}"
                   class="w-full px-3 py-2 border rounded-lg text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Rol</label>
            <select name="rol" class="w-full px-3 py-2 border rounded-lg text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                {% for value, label in roles %}
                <option value="{{ value }}" {% if value == usuario.rol %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="flex items-center space-x-4 pt-2">
            <button type="submit"
                    class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm">
                Guardar Cambios
            </button>
            <a href="{% url 'usuarios:gestion' %}" class="text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
